name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

# Least-privilege: this workflow only needs to read the checkout
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            - run: npm run lint
